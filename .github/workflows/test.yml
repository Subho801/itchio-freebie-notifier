name: Itch.io Freebie Notifier

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  check-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm install

      - name: Run itch scraper
        run: node itch-scraper.js

      - name: Check new games
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: python itch.py

      - name: Publish website feed and save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Include expiry_cache.json so itch.io date requests stay cached across runs
          git add result.json itch_state.json expiry_cache.json

          if git diff --cached --quiet; then
            echo "No feed or state changes."
            exit 0
          fi

          git commit -m "Update itch.io giveaway feed, state, and expiry cache"
          git pull --rebase
          git push
